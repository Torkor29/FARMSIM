# FARMSIM — pile autonome, indépendante de tout autre site du serveur.
#
# Ne dépend d'aucun réseau ni conteneur externe : il publie son port sur
# l'hôte, et c'est le proxy commun du serveur (une pile séparée, hors de ce
# dépôt — voir deploy/Caddyfile.farmsim.exemple.caddy) qui vient le chercher
# là. Rien ici n'a besoin d'exister au préalable pour que
# « docker compose up » réussisse.
#
# Variables utiles (.env) :
#   FARMSIM_BIND  = 0.0.0.0 par défaut. Le proxy commun joint ce port via
#                   « host-gateway », ce qui exige que le port soit publié
#                   sur toutes les interfaces.
#   FARMSIM_PORT  = port publié sur l'hôte (8081 par défaut — 8080 est déjà
#                   pris par Comptap sur ce serveur).

name: farmsim

services:
  # ——————————————————————————————————————————————————————————————————————
  # La base.
  #
  # Le jeu a vécu sur un fichier SQLite. C'était le bon choix pour démarrer et
  # le mauvais pour durer : un seul écrivain à la fois, aucune sauvegarde à
  # chaud digne de ce nom, et des types si permissifs qu'une date pouvait
  # tomber en 1970 sans que rien ne proteste.
  #
  # Le conteneur n'expose **aucun port sur l'hôte** : seul le jeu lui parle,
  # par le réseau interne de la pile. Une base de données ouverte sur Internet
  # est la première chose qu'un balayage automatique trouve.
  # ——————————————————————————————————————————————————————————————————————
  db:
    container_name: farmsim-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmsim
      POSTGRES_USER: farmsim
      # Obligatoire, sans valeur par défaut : une base de production ne doit
      # pas pouvoir démarrer avec un mot de passe deviné depuis ce fichier.
      POSTGRES_PASSWORD: ${FARMSIM_DB_PASSWORD:?renseignez FARMSIM_DB_PASSWORD dans .env}
      # Les données du jeu sont en français : sans cela, tris et comparaisons
      # se feraient en C et « Étable » passerait après « Zone ».
      LANG: fr_FR.UTF-8
    volumes:
      - farmsim-pg:/var/lib/postgresql/data
    restart: unless-stopped
    # ——————————————————————————————————————————————————————————————————
    # Plafonds de la base.
    #
    # Mesuré sur un monde complet — 306 fermes, 615 parcelles, 88 560 cases,
    # 44 Mo de données : la somme des `RSS` de tous les processus PostgreSQL
    # atteint 171 Mo, et cette somme **surestime** la vraie consommation
    # puisqu'elle recompte la mémoire partagée à chaque backend. La
    # configuration est celle de l'image : `shared_buffers` à 128 Mo,
    # `work_mem` à 4 Mo, et le jeu n'ouvre que dix connexions
    # (`connection_limit=10` dans son `DATABASE_URL`).
    #
    # 384 Mo, soit plus du double du mesuré. On ne descend pas plus bas : un
    # PostgreSQL tué par le noyau à court de mémoire, c'est le jeu à l'arrêt et
    # une reprise sur journal au redémarrage. Le plafond est là pour empêcher
    # un emballement, pas pour serrer au plus juste.
    #
    # Pas de `memswap_limit` ici, volontairement : la base a le droit de
    # déborder un peu sur l'échange plutôt que de se faire tuer.
    # ——————————————————————————————————————————————————————————————————
    cpus: 0.5
    mem_limit: 384m
    mem_reservation: 192m
    # ——————————————————————————————————————————————————————————————————
    # Les journaux ont une taille maximale.
    #
    # Docker n'en impose aucune par défaut : le pilote `json-file` écrit sans
    # jamais tourner, et un conteneur qui vit des semaines finit par remplir
    # le disque à lui seul. Ce n'est pas une hypothèse d'école — le serveur
    # s'est retrouvé saturé, et un disque plein ne se contente pas de ralentir
    # Docker : PostgreSQL ne peut plus écrire, la sauvegarde échoue, et le
    # déploiement s'arrête sur une erreur qui ne dit rien de la vraie cause.
    #
    # Trois fichiers de cinquante mégaoctets : de quoi remonter largement
    # au-delà du dernier incident, sans que le journal puisse devenir le
    # problème qu'il sert à diagnostiquer.
    # ——————————————————————————————————————————————————————————————————
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmsim -d farmsim"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  farmsim:
    container_name: farmsim
    # ——————————————————————————————————————————————————————————————————
    # L'image vient du registre ; `build` reste le filet.
    #
    # Le VPS construisait l'image lui-même à chaque déploiement. Sur cette
    # machine, une construction sans cache demande six à sept minutes de
    # calcul — dont deux et demie pour le seul bundle web — et c'est ce qui a
    # fait dépasser le délai de la session SSH. Le vrai coût n'était pas le
    # dépassement : couper la session ne tue pas le `docker build` resté
    # derrière, et le déploiement **suivant** démarrait sur une machine
    # saturée par un orphelin. Un échec en causait un second.
    #
    # L'image est désormais construite par l'action, avec son cache, et
    # publiée sur ghcr.io. Le VPS n'a plus qu'à la tirer.
    #
    # Les deux clés cohabitent volontairement. `image` seule interdirait de
    # déployer quand le registre est indisponible ou pas encore alimenté ;
    # `build` seule ramènerait le problème. Avec les deux, `docker compose
    # pull` prend l'image toute faite quand elle existe, et `--build` reste
    # possible partout ailleurs — sur un poste de développement comme sur le
    # VPS en dépannage. Voir `scripts/vps-deploy.sh`.
    # ——————————————————————————————————————————————————————————————————
    image: ${FARMSIM_IMAGE:-farmsim:local}
    build: .
    ports:
      - "${FARMSIM_BIND:-0.0.0.0}:${FARMSIM_PORT:-8081}:8080"
    depends_on:
      db:
        # Le jeu applique ses migrations au démarrage : il doit trouver une
        # base qui répond, pas un conteneur qui vient d'être créé.
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://farmsim:${FARMSIM_DB_PASSWORD:?renseignez FARMSIM_DB_PASSWORD dans .env}@db:5432/farmsim?schema=public&connection_limit=10"
      # Comptes autorisés aux outils de test sur le jeu public, séparés par des
      # virgules. Vide par défaut : sans valeur dans `.env`, personne n'y a
      # droit et les routes de triche répondent 404 à tout le monde.
      #
      # `FARMSIM_DEV_TOOLS` n'est **délibérément pas** transmis ici. Il ouvre
      # la triche à quiconque est connecté ; le laisser passer par `.env`
      # rendrait cette bévue possible en une ligne, un soir. Sur une
      # installation locale on lance l'API à la main, sans Docker.
      FARMSIM_TESTERS: "${FARMSIM_TESTERS:-}"
      # ————————————————————————————————————————————————————————————————
      # Le tas de V8, plafonné à la main.
      #
      # Sans cette ligne, Node dimensionne son tas d'après la mémoire de
      # **l'hôte** : sur une machine de 2 Go il se donne plusieurs centaines de
      # mégaoctets, les remplit avant de ramasser, et le voisinage paie la
      # note en échange disque. Mesuré, tas libre : le processus culmine à
      # 1 157 Mo et navigue entre 730 et 950 Mo au repos.
      #
      # À 192 Mo, le même processus démarre à froid en 34 s — monde entier
      # semé, 306 fermes — avec un pic de 613 Mo, et se stabilise à 331 Mo.
      # C'est un plancher, pas une valeur ronde : à 128 Mo, V8 abandonne au
      # démarrage (`JavaScript heap out of memory`), mesuré aussi.
      #
      # Le plafond du conteneur ne remplace pas celui-ci : le moteur de
      # requêtes Prisma alloue hors du tas V8, et seul `mem_limit` le borne.
      # Les deux servent, chacun de son côté.
      # ————————————————————————————————————————————————————————————————
      NODE_OPTIONS: "--max-old-space-size=192"
    tmpfs:
      - /tmp:size=64M,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ——————————————————————————————————————————————————————————————————
    # Un vrai numéro 1.
    #
    # `CMD ["sh", "-c", "prisma migrate deploy && node dist/main.js"]` fait du
    # shell le processus numéro 1 du conteneur. Deux conséquences, et aucune
    # n'est théorique :
    #
    #  - **il ne récolte pas les orphelins.** Un processus numéro 1 doit
    #    ramasser les enfants abandonnés ; ni `sh` ni `node` ne le font. Les
    #    zombies s'accumulent, chacun retenant une entrée de table de
    #    processus. Le serveur en compte 88 — on ne sait pas d'où ils sortent,
    #    et c'est bien le problème : cette pile-ci ne pourra plus y contribuer.
    #  - **il n'a pas transmis le signal d'arrêt.** `docker compose down`
    #    envoie `SIGTERM` au numéro 1, c'est-à-dire au shell, qui ne le
    #    répercute pas sur `node`. Docker attend dix secondes, puis tue.
    #    Chaque déploiement coûtait donc dix secondes et une base fermée sans
    #    ménagement.
    #
    # `init: true` glisse `tini` en numéro 1 : il récolte, et il transmet.
    # ——————————————————————————————————————————————————————————————————
    init: true
    # ——————————————————————————————————————————————————————————————————
    # Plafonds du jeu. **Le voisinage n'est plus à la merci d'un tick.**
    #
    # La machine héberge PostgreSQL, ce jeu, et une autre application qui ne
    # relève pas de ce dépôt. Elle a été trouvée à 246 Mo libres sur 1 906, à
    # 1 248 Mo d'échange sur 2 047, et à 25,81 / 29,19 / 31,35 de charge
    # moyenne. Rien ici ne bornait le jeu : il pouvait prendre tout ce qui
    # restait, et c'est ce qu'il faisait.
    #
    # Les mesures, sur le monde complet et l'image telle qu'elle est bâtie :
    #
    #   tas V8      démarrage à froid   au repos      pic       processeur
    #   libre       ok                  730–950 Mo    1 157 Mo  30 % d'un cœur
    #   256 Mo      ok                  615–695 Mo      794 Mo  30 % d'un cœur
    #   192 Mo      ok, 34 s, 27 s CPU  331 Mo          731 Mo  30 % d'un cœur
    #   128 Mo      échec — V8 renonce      —              —        —
    #
    # D'où les deux chiffres :
    #
    #  - **896 Mo**, soit 23 % au-dessus du plus haut relevé avec le tas
    #    plafonné (731 Mo), et 23 % **en dessous** du pic sans plafond. Le
    #    conteneur ne peut donc plus, à lui seul, faire basculer la machine
    #    dans l'échange.
    #  - **1 cœur**, quand la mesure donne 30 % d'un cœur au repos et 80 % le
    #    temps d'un démarrage à froid. Ce n'est pas un chiffre rond choisi de
    #    loin : c'est le pic mesuré, plus un quart. À plus de joueurs
    #    simultanés il faudra le relever — et refaire la mesure, pas doubler
    #    au jugé.
    #
    # `memswap_limit` égale `mem_limit` : le conteneur n'a **aucun** droit à
    # l'échange. C'est délibéré. Un Node qui pagine ne ralentit pas seulement,
    # il fait exploser la charge moyenne de toute la machine — c'est
    # exactement ce qu'on lit dans les trois chiffres relevés. S'il dépasse, il
    # est tué net et `restart: unless-stopped` le relève. Pour le savoir plutôt
    # que le supposer :
    #
    #     docker inspect farmsim --format '{{.State.OOMKilled}} {{.RestartCount}}'
    #
    # Si cela arrive pour de bon, c'est le plafond qu'il faut relever, pas
    # l'échange qu'il faut rouvrir.
    # ——————————————————————————————————————————————————————————————————
    cpus: 1.0
    mem_limit: 896m
    memswap_limit: 896m
    mem_reservation: 384m
    restart: unless-stopped
    # ——————————————————————————————————————————————————————————————————
    # Les journaux ont une taille maximale.
    #
    # Docker n'en impose aucune par défaut : le pilote `json-file` écrit sans
    # jamais tourner, et un conteneur qui vit des semaines finit par remplir
    # le disque à lui seul. Ce n'est pas une hypothèse d'école — le serveur
    # s'est retrouvé saturé, et un disque plein ne se contente pas de ralentir
    # Docker : PostgreSQL ne peut plus écrire, la sauvegarde échoue, et le
    # déploiement s'arrête sur une erreur qui ne dit rien de la vraie cause.
    #
    # Trois fichiers de cinquante mégaoctets : de quoi remonter largement
    # au-delà du dernier incident, sans que le journal puisse devenir le
    # problème qu'il sert à diagnostiquer.
    # ——————————————————————————————————————————————————————————————————
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Le monde s'amorce avant que le port ne s'ouvre ; après une migration
      # qui introduit une population nouvelle, ce premier démarrage se compte
      # en minutes. Trop court, Docker déclarait le conteneur malade pendant
      # qu'il travaillait.
      start_period: 300s

volumes:
  farmsim-pg:
  # L'ancien volume SQLite. Il n'est plus monté, mais **on ne le supprime
  # pas** : c'est la seule copie des données d'avant la bascule tant que la
  # nouvelle base n'a pas fait ses preuves. Voir docs/POSTGRESQL.md.
  farmsim-data:
