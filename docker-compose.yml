# FARMSIM — pile autonome, indépendante de tout autre site du serveur.
#
# Ne dépend d'aucun réseau ni conteneur externe : il publie son port sur
# l'hôte, et c'est le proxy commun du serveur (une pile séparée, hors de ce
# dépôt — voir deploy/Caddyfile.farmsim.exemple.caddy) qui vient le chercher
# là. Rien ici n'a besoin d'exister au préalable pour que
# « docker compose up » réussisse.
#
# Variables utiles (.env) :
#   FARMSIM_BIND  = 0.0.0.0 par défaut. Le proxy commun joint ce port via
#                   « host-gateway », ce qui exige que le port soit publié
#                   sur toutes les interfaces.
#   FARMSIM_PORT  = port publié sur l'hôte (8081 par défaut — 8080 est déjà
#                   pris par Comptap sur ce serveur).

name: farmsim

services:
  # ——————————————————————————————————————————————————————————————————————
  # La base.
  #
  # Le jeu a vécu sur un fichier SQLite. C'était le bon choix pour démarrer et
  # le mauvais pour durer : un seul écrivain à la fois, aucune sauvegarde à
  # chaud digne de ce nom, et des types si permissifs qu'une date pouvait
  # tomber en 1970 sans que rien ne proteste.
  #
  # Le conteneur n'expose **aucun port sur l'hôte** : seul le jeu lui parle,
  # par le réseau interne de la pile. Une base de données ouverte sur Internet
  # est la première chose qu'un balayage automatique trouve.
  # ——————————————————————————————————————————————————————————————————————
  db:
    container_name: farmsim-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmsim
      POSTGRES_USER: farmsim
      # Obligatoire, sans valeur par défaut : une base de production ne doit
      # pas pouvoir démarrer avec un mot de passe deviné depuis ce fichier.
      POSTGRES_PASSWORD: ${FARMSIM_DB_PASSWORD:?renseignez FARMSIM_DB_PASSWORD dans .env}
      # Les données du jeu sont en français : sans cela, tris et comparaisons
      # se feraient en C et « Étable » passerait après « Zone ».
      LANG: fr_FR.UTF-8
    volumes:
      - farmsim-pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmsim -d farmsim"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  farmsim:
    container_name: farmsim
    build: .
    ports:
      - "${FARMSIM_BIND:-0.0.0.0}:${FARMSIM_PORT:-8081}:8080"
    depends_on:
      db:
        # Le jeu applique ses migrations au démarrage : il doit trouver une
        # base qui répond, pas un conteneur qui vient d'être créé.
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://farmsim:${FARMSIM_DB_PASSWORD:?renseignez FARMSIM_DB_PASSWORD dans .env}@db:5432/farmsim?schema=public&connection_limit=10"
      # Comptes autorisés aux outils de test sur le jeu public, séparés par des
      # virgules. Vide par défaut : sans valeur dans `.env`, personne n'y a
      # droit et les routes de triche répondent 404 à tout le monde.
      #
      # `FARMSIM_DEV_TOOLS` n'est **délibérément pas** transmis ici. Il ouvre
      # la triche à quiconque est connecté ; le laisser passer par `.env`
      # rendrait cette bévue possible en une ligne, un soir. Sur une
      # installation locale on lance l'API à la main, sans Docker.
      FARMSIM_TESTERS: "${FARMSIM_TESTERS:-}"
    tmpfs:
      - /tmp:size=64M,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Le monde s'amorce avant que le port ne s'ouvre ; après une migration
      # qui introduit une population nouvelle, ce premier démarrage se compte
      # en minutes. Trop court, Docker déclarait le conteneur malade pendant
      # qu'il travaillait.
      start_period: 300s

volumes:
  farmsim-pg:
  # L'ancien volume SQLite. Il n'est plus monté, mais **on ne le supprime
  # pas** : c'est la seule copie des données d'avant la bascule tant que la
  # nouvelle base n'a pas fait ses preuves. Voir docs/POSTGRESQL.md.
  farmsim-data:
