# Déploiement automatique sur le VPS, à chaque poussée sur `main`.
#
# Jusqu'ici il fallait ouvrir une session SSH, coller une commande, puis lire
# un mur de journaux pour savoir si ça avait marché — parfois depuis un
# téléphone. Deux pannes de cette semaine (une migration cassée, une image qui
# ne se construisait plus) ne se sont vues qu'à ce moment-là, alors que les
# tests les auraient signalées avant.
#
# D'où l'ordre des deux étapes : on **vérifie d'abord, on déploie ensuite**.
# Une poussée qui casse la compilation ou un test ne part jamais sur le
# serveur, et le rapport est lisible dans l'onglet Actions plutôt que dans un
# terminal mobile.
name: Déploiement

on:
  push:
    branches: [main]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet Actions,
  # sans avoir à pousser un commit vide.
  workflow_dispatch:

concurrency:
  # Deux poussées rapprochées ne doivent pas déployer en même temps : le
  # second `docker compose up` couperait le premier en pleine migration.
  group: deploiement-vps
  cancel-in-progress: false

jobs:
  verifier:
    name: Compiler et tester
    runs-on: ubuntu-latest

    # Une vraie base, pas une imitation.
    #
    # Le jeu tournait sur SQLite ; il tourne sur PostgreSQL. Des suites qui
    # continueraient à s'exécuter sur un fichier ne prouveraient plus rien de
    # ce qui tourne en production : les types ne sont pas les mêmes (les dates,
    # les booléens), les contraintes ne se comportent pas pareil, et le SQL
    # écrit à la main non plus — c'est ainsi qu'un `UPDATE Machine` sans
    # guillemets passait ici et échouait là-bas.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmsim
          POSTGRES_PASSWORD: farmsim-local
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmsim"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Les suites créent chacune leur base jetable sur ce serveur, et la
      # détruisent en partant.
      FARMSIM_TEST_PG: postgresql://farmsim:farmsim-local@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # `pg_dump`, `pg_restore` et `psql` en version 16 : le client livré par
      # défaut sur les exécuteurs GitHub est plus ancien que le serveur, et
      # `pg_dump` refuse net de travailler dans ce sens. C'est l'exercice de
      # restauration qui en a besoin.
      - name: Installer le client PostgreSQL 16
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          psql --version

      # Pas de version en dur : `pnpm/action-setup` lit le champ
      # `packageManager` du package.json, seule source de vérité.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le client Prisma est nécessaire à la compilation de l'API.
      - run: pnpm --filter @farmsim/api exec prisma generate

      # `pnpm -r build` est exactement ce que lance le Dockerfile : si cette
      # étape passe, l'image se construira. C'est la vérification qui manquait
      # quand des fichiers de test ont fait échouer `tsc` en production.
      - name: Construire (comme le Dockerfile)
        run: pnpm -r build

      # `pnpm test` et non `pnpm -r test` : la racine ajoute l'exercice de
      # restauration, qui n'appartient à aucun paquet du monorepo et serait
      # sinon le seul filet du jeu à n'être jamais joué.
      - name: Tester les trois paquets et l'exercice de restauration
        run: pnpm test

  # ——————————————————————————————————————————————————————————————————————
  # Construire l'image ici, et non sur le VPS.
  #
  # Le VPS la construisait lui-même à chaque déploiement. Sur cette petite
  # machine, une construction sans cache demande six à sept minutes de calcul,
  # et c'est ce qui a fait dépasser le délai de la session SSH. Le vrai coût
  # n'était pas le dépassement mais sa suite : couper la session ne tue pas le
  # `docker build` resté derrière, si bien que le déploiement **suivant**
  # démarrait sur une machine saturée. Trois échecs de suite, et le jeu à
  # terre.
  #
  # Ici, la construction a un cache qui survit d'une exécution à l'autre, une
  # machine qui ne sert qu'à ça, et son échec n'a aucune conséquence sur le
  # serveur en production — puisqu'on n'y a même pas touché.
  #
  # L'image est publique, comme le dépôt : le VPS la tire sans authentifi-
  # cation, il n'y a donc aucun jeton à installer ni à faire tourner sur le
  # serveur. C'est ce qui rend ce changement plus simple que ce qu'il
  # remplace, et pas seulement plus rapide.
  # ——————————————————————————————————————————————————————————————————————
  construire:
    name: Construire et publier l'image
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige un chemin en minuscules ; le compte s'écrit « Torkor29 ».
      - name: Choisir le nom de l'image
        id: nom
        run: |
          depot="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${depot}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Deux étiquettes, et les deux servent : `main` est ce que tire un
          # dépannage manuel, l'empreinte du commit est ce que tire ce
          # déploiement-ci. Sans la seconde, deux déploiements rapprochés
          # pourraient livrer l'image l'un de l'autre.
          tags: |
            ${{ steps.nom.outputs.image }}:main
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
          # Le cache vit dans l'espace de l'action et survit d'une exécution à
          # l'autre : une construction qui ne change que le code applicatif ne
          # réinstalle pas les dépendances ni ne réamorce Prisma.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deployer:
    name: Déployer sur le VPS
    needs: [verifier, construire]
    runs-on: ubuntu-latest
    steps:
      # Sans les trois secrets, l'étape suivante échouerait sur une erreur de
      # connexion incompréhensible. On le dit clairement, et on s'arrête là
      # sans marquer le déploiement en échec : la vérification, elle, a bien
      # eu lieu.
      - name: Vérifier que le serveur est configuré
        id: config
        env:
          HOTE: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOTE" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets absents — ajoutez VPS_HOST, VPS_USER et VPS_SSH_KEY dans Settings › Secrets and variables › Actions. Rien n'a été déployé."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      # « exit code 1 » au bout de cinq secondes ne dit pas *pourquoi* : port
      # fermé, hôte injoignable, clé refusée ? Ces trois pannes se corrigent
      # différemment. On les sépare avant d'essayer de se connecter.
      - name: Diagnostiquer l'accès au serveur
        if: steps.config.outputs.pret == 'oui'
        env:
          HOTE: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
          CLE: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "── Forme de l'adresse ──"
          if printf '%s' "$HOTE" | grep -q ':'; then
            echo "PROBLÈME : VPS_HOST ressemble à une adresse IPv6."
            echo "Les machines GitHub n'ont pas d'IPv6 sortant. Il faut l'IPv4,"
            echo "obtenue sur le serveur par :  curl -s -4 ifconfig.me"
            exit 1
          fi
          echo "OK (pas d'IPv6)"

          echo "── Forme de la clé ──"
          if ! printf '%s' "$CLE" | head -n 1 | grep -q 'BEGIN'; then
            echo "PROBLÈME : VPS_SSH_KEY ne commence pas par une ligne BEGIN."
            echo "Collez la clé PRIVÉE entière, de -----BEGIN à -----END inclus."
            exit 1
          fi
          # Une clé sans saut de ligne final est refusée par OpenSSH avec un
          # « no key found » très peu parlant. C'est le piège classique quand
          # on copie depuis un terminal mobile.
          if [ -n "$(tail -c 1 <<< "$CLE")" ]; then
            echo "AVERTISSEMENT : la clé n'a pas de saut de ligne final."
            echo "Réenregistrez le secret en appuyant sur Entrée après -----END."
          fi
          echo "OK (forme plausible)"

          echo "── Le port SSH répond-il ? ──"
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOTE/$PORT" 2>/dev/null; then
            echo "OK : $HOTE:$PORT accepte les connexions."
          else
            echo "PROBLÈME : impossible d'ouvrir $HOTE:$PORT depuis GitHub."
            echo "Soit l'adresse est fausse, soit un pare-feu bloque le port 22"
            echo "aux adresses extérieures. Vérifiez :  sudo ufw status"
            exit 1
          fi

      - name: Ouvrir une session et lancer le script de déploiement
        if: steps.config.outputs.pret == 'oui'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # L'amorçage du monde peut prendre plusieurs minutes au premier
          # démarrage suivant une migration : le script attend jusqu'à cinq
          # minutes. Une image Docker sans cache (pnpm + Prisma + vite)
          # dépasse souvent vingt minutes sur le VPS : on laisse quarante.
          command_timeout: 40m
          # Le nom du site, pour que le script teste lui-même le passage par le
          # portier commun. Sans lui il sautait sa vérification finale et
          # annonçait « déployé » alors que seul le conteneur avait répondu,
          # en local sur le VPS — le HTTPS public n'était jamais éprouvé.
          # Une variable de dépôt le rend modifiable sans toucher au workflow ;
          # à défaut, le domaine du fichier Caddy fait foi.
          script: |
            set -euo pipefail
            DOMAINE='${{ vars.FARMSIM_DOMAIN || 'farming-navigator.com' }}'
            # Surtout **pas** `bash /opt/farmsim/scripts/vps-deploy.sh` : le
            # script fait un `git reset --hard` sur le dépôt qui le contient,
            # donc il se réécrit lui-même pendant que bash le lit ligne à
            # ligne. On le prend depuis GitHub, comme la commande manuelle
            # déjà éprouvée sur ce serveur.
            #
            # Le domaine se passe **dans** la commande et non par
            # l'environnement : `sudo --preserve-env` dépend de la politique
            # sudoers du serveur et peut être refusé sans que rien ne le dise.
            # Là, il n'y a rien à autoriser.
            # L'image est passée au script, qui la tire au lieu de la
            # construire. Elle est désignée par l'empreinte du commit et non
            # par `main` : deux déploiements rapprochés livreraient sinon
            # chacun l'image de l'autre, et on ne saurait plus ce qui tourne.
            #
            # Le script se replie sur une construction locale si le registre
            # ne répond pas — un déploiement lent vaut mieux que pas de
            # déploiement du tout. Voir `scripts/vps-deploy.sh`.
            IMAGE='${{ needs.construire.outputs.image }}:${{ github.sha }}'
            URL='https://raw.githubusercontent.com/Torkor29/FARMSIM/main/scripts/vps-deploy.sh'
            # On télécharge le script dans un fichier, puis on l'exécute — et
            # surtout pas `curl … | bash`.
            #
            # Mesuré, et c'est le défaut le plus coûteux de toute cette série :
            #
            #     curl: (35) Recv failure: Connection reset by peer
            #     ✅ Successfully executed commands to all hosts.
            #
            # Le téléchargement échoue, `bash` reçoit un flux vide, ne fait
            # rien et sort avec le code 0 — c'est **son** code que le tube
            # retient, pas celui de `curl`. Le déploiement a duré cinquante-six
            # secondes, n'a rien déployé, et s'est déclaré réussi. Un
            # déploiement qui ment sur son résultat est pire qu'un déploiement
            # qui échoue : on cherche la panne partout ailleurs.
            #
            # Le danger jumeau est plus grave encore : un téléchargement
            # **tronqué** fait exécuter un demi-script. Celui-ci arrête des
            # conteneurs avant de les recréer ; s'interrompre au milieu laisse
            # le jeu à terre. `bash -n` relit le fichier entier avant de le
            # lancer, ce qu'un tube ne permet structurellement pas.
            sudo -n bash -c "
              set -euo pipefail
              script=\$(mktemp)
              trap 'rm -f \"\$script\"' EXIT
              curl -fsSL --retry 3 --retry-delay 2 --max-time 180 -o \"\$script\" '$URL'
              test -s \"\$script\"
              bash -n \"\$script\"
              FARMSIM_DOMAIN='$DOMAINE' FARMSIM_IMAGE='$IMAGE' bash \"\$script\"
            "
