<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Abreuvoir automatique : bac inox à niveau constant, sur son arrivée d'eau. -->
  <g fill="none" fill-rule="evenodd">
    <ellipse cx="48" cy="82" rx="30" ry="9" fill="#8fbf6a"/>

    <!-- L'arrivée d'eau enterrée, qui remonte derrière le bac -->
    <path d="M68 70V34h-9" stroke="#7f8b93" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="30" r="4" fill="#b9c4cb" stroke="#7f8b93" stroke-width="2"/>

    <!-- Le bac -->
    <path d="M20 44h56l-5 28H25Z" fill="#c9d4db" stroke="#7f8b93" stroke-width="2" stroke-linejoin="round"/>
    <!-- L'eau, à son niveau constant -->
    <path d="M24 52h48l-2 12H26Z" fill="#69b6e0"/>
    <path d="M28 56q6-3 12 0t12 0 12 0" stroke="#a6dcf5" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Le rebord, qui attrape la lumière -->
    <path d="M20 44h56" stroke="#eef3f6" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
