<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Laiterie : un bâtiment bas, ses cuves inox, et le lait qui entre. -->
  <g fill="none" fill-rule="evenodd">
    <ellipse cx="48" cy="84" rx="34" ry="9" fill="#8fbf6a"/>
    <rect x="18" y="44" width="60" height="34" rx="2" fill="#f0ece0" stroke="#7d6f5a" stroke-width="2"/>
    <path d="M14 44 48 24 82 44Z" fill="#9aa7ad" stroke="#67737a" stroke-width="2" stroke-linejoin="round"/>
    <!-- Deux cuves de maturation, la signature d'une laiterie. -->
    <rect x="26" y="52" width="16" height="24" rx="7" fill="#cdd6da" stroke="#67737a" stroke-width="2"/>
    <rect x="50" y="52" width="16" height="24" rx="7" fill="#cdd6da" stroke="#67737a" stroke-width="2"/>
    <path d="M30 60h8M54 60h8" stroke="#8fa1a8" stroke-width="2" stroke-linecap="round"/>
    <!-- Le bidon posé devant : ce qui entre, en un coup d'œil. -->
    <path d="M70 66h8l1 12h-10z" fill="#fdfaf2" stroke="#7d6f5a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M72 62h4v4h-4z" fill="#fdfaf2" stroke="#7d6f5a" stroke-width="2"/>
  </g>
</svg>
