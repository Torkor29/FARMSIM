<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Personnel : deux silhouettes, celle de devant coiffée d'une casquette. -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Le second, en retrait -->
    <circle cx="21.5" cy="11" r="3.2"/>
    <path d="M26.5 25v-1.6a4.6 4.6 0 0 0-3.4-4.4"/>
    <!-- Celui de devant -->
    <circle cx="12.5" cy="11.5" r="4"/>
    <path d="M5 25v-2a5 5 0 0 1 5-5h5a5 5 0 0 1 5 5v2"/>
    <!-- La visière : on reconnaît un ouvrier, pas un contact -->
    <path d="M8.4 9.2h8.2"/>
  </g>
</svg>
