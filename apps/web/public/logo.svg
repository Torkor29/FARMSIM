  <text x="200" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="34" fill="url(#gold)" letter-spacing="1">NAVIGATOR</text>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#9ec9ff" letter-spacing="3">ÉLEVAGE · CULTURE · GESTION</text>
